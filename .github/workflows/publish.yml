name: Publish to ClawHub

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: clawhub-publish
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
    # openclaw/clawhub v0.27.0
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@dfb087d90079c84f74ed0c5de27c302696d42178
    with:
      skill_path: "."
      dry_run: true

  publish:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    # openclaw/clawhub v0.27.0
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@dfb087d90079c84f74ed0c5de27c302696d42178
    with:
      skill_path: "."
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
